name: Check SLAY AutoRefs JavaScript

on:
  push:
    paths:
      - index.js
      - .github/workflows/install-autorefs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extension
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check index.js
